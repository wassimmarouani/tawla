version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # ADR-0002: never adopt a release younger than 14 days (security updates excepted).
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types follow the runtime: Node 24 LTS (.nvmrc). Bump with the runtime, not before.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    # One PR for all action updates: they touch the same workflow file.
    groups:
      actions:
        patterns: ['*']
