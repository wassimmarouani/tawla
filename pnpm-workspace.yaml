# Single-package repo: this file only holds pnpm settings (ADR-0002).
packages:
  - .

# Supply-chain safety: refuse versions published less than 14 days ago.
# Security releases are adopted explicitly via minimumReleaseAgeExclude.
minimumReleaseAge: 20160

# Exact versions only.
savePrefix: ''

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: true
  unrs-resolver: true
